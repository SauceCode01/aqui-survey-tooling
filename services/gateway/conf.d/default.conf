server {
    listen 80;
    listen 3000;

    absolute_redirect off;

    # Health check for the gateway itself
    location /health {
        return 200 '{"status":"ok","service":"gateway"}';
        add_header Content-Type application/json;
    }

    # Redirect root / to the frontend base path
    location = / {
        return 301 /web;
    }

    # Modular service route definitions
    include /etc/nginx/conf.d/routes/*.conf;
}
