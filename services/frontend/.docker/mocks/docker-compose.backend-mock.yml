services:
  backend-mock:
    image: wiremock/wiremock:3.9.1
    volumes:
      - ./.docker/mocks/wiremock/mappings:/home/wiremock/mappings:ro
      - ./.docker/mocks/wiremock/__files:/home/wiremock/__files:ro
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:8080/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    depends_on:
      backend-mock:
        condition: service_healthy
