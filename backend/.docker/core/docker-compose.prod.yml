services:
  app: 
    build:
      target: prod
    env_file:
      - ../../.env.prod
    environment:
      - INFRA_MODE=integrated 
      - EXEC_MODE=prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "8"

